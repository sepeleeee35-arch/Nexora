name: nexora
description: Nexora - original mobile hub app.
publish_to: "none"
version: 1.0.2+4

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  http: ^1.5.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/music/
