name: nexora
description: Nexora - original mobile hub app.
publish_to: "none"
version: 1.0.7

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  http: ^1.5.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  flutter_app_installer: ^2.0.0
  image_picker: ^1.1.2
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/music/
    - assets/games/
