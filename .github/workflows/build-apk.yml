name: Build Nexora APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.nexora .

      - name: Set Nexora app icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_nexora.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#6D28D9"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M22,18h15l34,49V18h15v72H71L37,41v49H22z" />
          </vector>
          EOF
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/ic_nexora"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="nexora"#android:label="Nexora"#' android/app/src/main/AndroidManifest.xml || true

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Configure Android APK installer
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path path="Android/data/com.nexora/" name="files_root" />
              <external-path path="." name="external_storage_root" />
          </paths>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if "REQUEST_INSTALL_PACKAGES" not in s:
              s=s.replace("    <application", "    <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\" />\n    <application", 1)
          provider='''        <provider\n            android:name="androidx.core.content.FileProvider"\n            android:authorities="${applicationId}.fileProvider"\n            android:exported="false"\n            android:grantUriPermissions="true">\n            <meta-data\n                android:name="android.support.FILE_PROVIDER_PATHS"\n                android:resource="@xml/file_paths" />\n        </provider>\n'''
          if "android.support.FILE_PROVIDER_PATHS" not in s:
              s=s.replace("    </application>", provider+"    </application>", 1)
          p.write_text(s)
          PY

      - name: Configure Google Sign-In build client
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then echo "::warning::GOOGLE_CLIENT_ID GitHub secret belum diisi; APK tetap dibuild, tetapi Google login belum bisa dipakai."; fi

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Prepare direct APK
        shell: bash
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml)
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Nexora-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-APK
          path: build/app/outputs/flutter-apk/Nexora-*.apk
          if-no-files-found: error

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml)
          RELEASE_VERSION="\${VERSION%%+*}"
          TAG="v\${RELEASE_VERSION}"
          FILE="build/app/outputs/flutter-apk/Nexora-\${VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "Nexora v1.0.0" --notes "Nexora Android release APK."
          fi
