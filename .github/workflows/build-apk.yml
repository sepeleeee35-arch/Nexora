name: Build Nexora APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.nexora .

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

# Release APK build trigger.
