name: Build Nexora APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexora-apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.nexora .

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Set Nexora app icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_nexora.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0B1020" android:pathData="M24,4H84C97.255,4 104,10.745 104,24V84C104,97.255 97.255,104 84,104H24C10.745,104 4,97.255 4,84V24C4,10.745 10.745,4 24,4Z" />
              <path android:fillColor="#4C1D95" android:pathData="M54,13L89,33V73L54,95L19,73V33Z" />
              <path android:fillColor="#312E81" android:pathData="M54,21L81,37V69L54,87L27,69V37Z" />
              <path android:fillColor="#F8FAFC" android:pathData="M28,78V30H40L68,61V30H80V78H68L40,47V78Z" />
              <path android:fillColor="#A78BFA" android:pathData="M49,52L54,47L59,52L54,57Z" />
              <path android:fillColor="#67E8F9" android:pathData="M76,19L78,24L83,26L78,28L76,33L74,28L69,26L74,24Z" />
          </vector>
          EOF

          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/ic_nexora"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/ic_nexora"#' android/app/src/main/AndroidManifest.xml || true
          sed -i 's#android:label="nexora"#android:label="Nexora"#' android/app/src/main/AndroidManifest.xml || true

      - name: Configure Android APK installer
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/xml

          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path path="Android/data/com.nexora/" name="files_root" />
              <external-path path="." name="external_storage_root" />
          </paths>
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in s:
              s = s.replace("    <application", permission + "    <application", 1)

          provider = '''        <provider
              android:name="androidx.core.content.FileProvider"
              android:authorities="${applicationId}.fileProvider"
              android:exported="false"
              android:grantUriPermissions="true">
              <meta-data
                  android:name="android.support.FILE_PROVIDER_PATHS"
                  android:resource="@xml/file_paths" />
          </provider>
          '''

          if "android.support.FILE_PROVIDER_PATHS" not in s:
              s = s.replace("    </application>", provider + "    </application>", 1)

          p.write_text(s)
          PY


      - name: Configure permanent release signing
        shell: bash
        env:
          NEXORA_KEYSTORE_BASE64: ${{ secrets.NEXORA_KEYSTORE_BASE64 }}
          NEXORA_KEYSTORE_PASSWORD: ${{ secrets.NEXORA_KEYSTORE_PASSWORD }}
          NEXORA_KEY_ALIAS: ${{ secrets.NEXORA_KEY_ALIAS }}
          NEXORA_KEY_PASSWORD: ${{ secrets.NEXORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in NEXORA_KEYSTORE_BASE64 NEXORA_KEYSTORE_PASSWORD NEXORA_KEY_ALIAS NEXORA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          mkdir -p android/app
          printf '%s' "$NEXORA_KEYSTORE_BASE64" | base64 --decode > android/app/nexora-release.jks
          test -s android/app/nexora-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import os
          Path("android/key.properties").write_text(
              "storePassword=" + os.environ["NEXORA_KEYSTORE_PASSWORD"] + "\n"
              "keyPassword=" + os.environ["NEXORA_KEY_PASSWORD"] + "\n"
              "keyAlias=" + os.environ["NEXORA_KEY_ALIAS"] + "\n"
              "storeFile=nexora-release.jks\n"
          )
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          header = '''import java.io.FileInputStream
          import java.util.Properties
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          '''
          if "val keystoreProperties = Properties()" not in s:
              s = header + s
          signing = '''    signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties.getProperty("keyAlias")
                  keyPassword = keystoreProperties.getProperty("keyPassword")
                  storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }
                  storePassword = keystoreProperties.getProperty("storePassword")
              }
          }
          '''
          if 'create("release")' not in s:
              s = s.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
              1
          )
          p.write_text(s)
          PY
          chmod 600 android/key.properties android/app/nexora-release.jks

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        shell: bash
        env:
          GOOGLE_CLIENT_ID_SECRET: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID_SECRET: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          DEFAULT_WEB_CLIENT_ID="884139341759-mrna2bd2a81d1dpj2nofbondk75i8lno.apps.googleusercontent.com"
          CLIENT_ID="${GOOGLE_CLIENT_ID_SECRET:-$DEFAULT_WEB_CLIENT_ID}"
          SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID_SECRET:-$DEFAULT_WEB_CLIENT_ID}"

          if [ -z "$CLIENT_ID" ] || [ -z "$SERVER_CLIENT_ID" ]; then
            echo "::error::Google client ID tidak boleh kosong."
            exit 1
          fi

          flutter build apk --release --target-platform android-arm64 \
            --dart-define="GOOGLE_CLIENT_ID=$CLIENT_ID" \
            --dart-define="GOOGLE_SERVER_CLIENT_ID=$SERVER_CLIENT_ID"

      - name: Verify APK signing certificate
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner tidak ditemukan."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare direct APK
        shell: bash
        run: |
          VERSION="$(awk '/^version:/{print $2}' pubspec.yaml)"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Nexora-${VERSION}.apk"

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-APK
          path: build/app/outputs/flutter-apk/Nexora-*.apk
          if-no-files-found: error
          overwrite: true

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(awk '/^version:/{print $2}' pubspec.yaml)"
          RELEASE_VERSION="${VERSION%%+*}"
          TAG="v${RELEASE_VERSION}"
          FILE="build/app/outputs/flutter-apk/Nexora-${VERSION}.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE"               --title "Nexora v${RELEASE_VERSION}"               --notes "Nexora Android release APK. Download the .apk asset directly; no ZIP extraction is required."
          fi
