name: Nexora Web Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  web-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Add web platform
        run: flutter create . --platforms web

      - name: Configure Google Sign-In web client
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('web/index.html')
          s = p.read_text()
          client = os.environ.get('GOOGLE_CLIENT_ID', '').strip()
          if client:
              lines = [x for x in s.splitlines() if 'google-signin-client_id' not in x]
              s = '\\n'.join(lines) + '\\n'
              s = s.replace('<head>', '<head>\\n    <meta name="google-signin-client_id" content="' + client + '">', 1)
              p.write_text(s)
          else:
              print('GOOGLE_CLIENT_ID is not configured; web Google login will remain unavailable.')
          PY

      - name: Get packages
        run: flutter pub get

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Build web release
        run: flutter build web --release

      - name: Upload Web Test
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Web-Test
          path: build/web
          if-no-files-found: error
